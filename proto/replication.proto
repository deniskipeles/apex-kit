syntax = "proto3";
package replication;

service Replication {
    rpc ExecuteWrite (WriteRequest) returns (WriteResponse);
    rpc FetchDbSnapshot (SnapshotRequest) returns (stream FileChunk);
    
    // Bi-Directional Stream: Replica sends subscriptions, Master streams CUD events
    rpc StreamEvents (stream EventSubscription) returns (stream DbChangeEvent);

    // [NEW] Sync files over gRPC
    rpc SyncFile (SyncFileRequest) returns (SyncFileResponse);
}

message WriteRequest { 
    string sql = 1; 
    bytes params = 2; 
    string db_path = 3; 
}

message WriteResponse { 
    bool success = 1; 
    int64 insert_id = 2; 
    string error = 3; 
}

message SnapshotRequest { 
    string db_path = 1; 
}

message FileChunk { 
    bytes data = 1; 
}

message EventSubscription {
    string replica_id = 1;
    repeated string add_scopes = 2; 
}

message DbChangeEvent {
    string scope = 1;      
    string db_name = 2;    
    bytes changeset = 3;   
}

// [NEW] Messages for File Sync
message SyncFileRequest {
    string scope = 1;
    string filename = 2;
    string mime_type = 3;
    bytes data = 4;
}

message SyncFileResponse {
    bool success = 1;
    string error = 2;
}