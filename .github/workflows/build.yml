name: Build ApexKit

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  OPENSSL_STATIC: 1
  PKG_CONFIG_ALL_STATIC: 1

# [FIX] Added explicit permissions to allow creating releases
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os_name: Linux
            binary_name: apexkit
            extension: ""
          - target: x86_64-pc-windows-gnu
            os_name: Windows
            binary_name: apexkit
            extension: ".exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 musl-tools nasm perl

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Admin UI
        working-directory: admin-ui
        run: |
          npm install
          npm run build

      - name: Move Admin Assets
        run: |
          mkdir -p static/dashboard
          cp -r admin-ui/dist/* static/dashboard/

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: |
          sudo pip install ziglang
          cargo install cargo-zigbuild

      - name: Build (${{ matrix.target }})
        run: |
          cargo zigbuild --target ${{ matrix.target }} --release -p apexkit-api

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          SRC_BIN="target/${{ matrix.target }}/release/apexkit-api${{ matrix.extension }}"
          DEST_BIN="dist/${{ matrix.binary_name }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$SRC_BIN" "$DEST_BIN"

      # [UPDATE] Upload to temporary storage for the next job
      - name: Upload to Actions
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: all-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}