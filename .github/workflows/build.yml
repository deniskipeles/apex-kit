name: Build and Publish ApexKit

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use GNU for Linux (ONNX Runtime provides prebuilt binaries for this)
          - target: x86_64-unknown-linux-gnu
            os_name: Linux
            runner: ubuntu-latest
            binary_name: apexkit
            extension: ""
          # Use MSVC for Windows (ONNX Runtime provides prebuilt binaries for this)
          - target: x86_64-pc-windows-msvc
            os_name: Windows
            runner: windows-latest
            binary_name: apexkit
            extension: ".exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Tailwind CSS
        id: cache-tailwind
        uses: actions/cache@v4
        with:
          path: static/tailwind-dark.full.css
          key: tailwind-css-2.2.19

      - name: Download Tailwind CSS
        if: steps.cache-tailwind.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p static
          curl -L -o static/tailwind-dark.full.css https://unpkg.com/tailwindcss@2.2.19/dist/tailwind-dark.css

      # Only install extra dependencies on Linux
      - name: Install System Dependencies (Linux)
        if: matrix.os_name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'admin-ui/package-lock.json'

      - name: Build Admin UI
        working-directory: admin-ui
        run: |
          npm install
          npm run build

      - name: Move Admin Assets
        shell: bash
        run: |
          mkdir -p static/dashboard
          cp -r admin-ui/dist/* static/dashboard/

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ matrix.target }}"

      # Native cargo build (No zigbuild needed since we use native runners now)
      - name: Build (${{ matrix.target }})
        run: |
          cargo build --target ${{ matrix.target }} --release -p apexkit-cli

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # The binary Cargo outputs
          SRC_BIN="target/${{ matrix.target }}/release/apexkit-cli${{ matrix.extension }}"
          # The clean name we want inside the archive
          BIN_NAME="apexkit${{ matrix.extension }}"
          
          # Copy it locally so the archive doesn't include the 'target/.../release/' folder structure
          cp "$SRC_BIN" "$BIN_NAME"

          if [ "${{ matrix.os_name }}" == "Windows" ]; then
            # Windows: Zip compression (use 7z as it's pre-installed on windows-latest bash)
            DEST_ARCHIVE="dist/${{ matrix.binary_name }}-${{ matrix.target }}.zip"
            7z a "$DEST_ARCHIVE" "$BIN_NAME"
          else
            # Linux: Tar.gz compression
            DEST_ARCHIVE="dist/${{ matrix.binary_name }}-${{ matrix.target }}.tar.gz"
            tar -czvf "$DEST_ARCHIVE" "$BIN_NAME"
          fi

      - name: Upload to Actions
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish_to_public:
    name: Publish to Public Repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          path: private-repo

      - name: Checkout Public Repo
        uses: actions/checkout@v4
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public-repo

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd all-binaries
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Update Public Repo Files
        run: |
          cp private-repo/Dockerfile public-repo/ 2>/dev/null || :
          cp private-repo/README.md public-repo/ 2>/dev/null || :
          cp -r private-repo/docs public-repo/ 2>/dev/null || :
          cp -r private-repo/hosting public-repo/ 2>/dev/null || :
          
          mkdir -p public-repo/static/images
          cp private-repo/static/images/apexkit-logo.svg public-repo/static/images/
          
          cd public-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add Dockerfile README.md docs hosting static/images
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync assets and docs for release ${{ github.ref_name }}"
          git push origin main
          
          git tag ${{ github.ref_name }} || true
          git push origin ${{ github.ref_name }} || true

      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          files: all-binaries/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false