name: Build and Publish ApexKit

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always
  OPENSSL_STATIC: 1
  PKG_CONFIG_ALL_STATIC: 1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os_name: Linux
            binary_name: apexkit
            extension: ""
          - target: x86_64-pc-windows-gnu
            os_name: Windows
            binary_name: apexkit
            extension: ".exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Tailwind CSS
        id: cache-tailwind
        uses: actions/cache@v4
        with:
          path: static/tailwind-dark.full.css
          key: tailwind-css-2.2.19

      - name: Download Tailwind CSS
        if: steps.cache-tailwind.outputs.cache-hit != 'true'
        run: |
          mkdir -p static
          curl -L -o static/tailwind-dark.full.css https://unpkg.com/tailwindcss@2.2.19/dist/tailwind-dark.css

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 musl-tools nasm perl cmake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'admin-ui/package-lock.json'

      - name: Build Admin UI
        working-directory: admin-ui
        run: |
          npm install
          npm run build

      - name: Move Admin Assets
        run: |
          mkdir -p static/dashboard
          cp -r admin-ui/dist/* static/dashboard/

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "v1-${{ matrix.target }}"

      - name: Install cargo-zigbuild
        run: |
          sudo pip install ziglang cargo-zigbuild

      - name: Build (${{ matrix.target }})
        run: |
          cargo zigbuild --target ${{ matrix.target }} --release -p apexkit-api

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          SRC_BIN="target/${{ matrix.target }}/release/apexkit-api${{ matrix.extension }}"
          DEST_BIN="dist/${{ matrix.binary_name }}-${{ matrix.target }}${{ matrix.extension }}"
          cp "$SRC_BIN" "$DEST_BIN"

      - name: Upload to Actions
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish_to_public:
    name: Publish to Public Repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the PRIVATE repo to grab Dockerfile and README
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          path: private-repo

      # 2. Checkout the PUBLIC repo to push files
      # CHANGE 'deniskipeles/apexkit' to your exact public repository name
      - name: Checkout Public Repo
        uses: actions/checkout@v4
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public-repo

      # 3. Download binaries from the build job
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      # 4. Generate Checksums
      - name: Generate Checksums
        run: |
          cd all-binaries
          sha256sum * > checksums.txt
          cat checksums.txt

      # 5. Sync Dockerfile, README, and docs to Public Repo
      - name: Update Public Repo Files
        run: |
          # Copy files from private to public workspace
          cp private-repo/Dockerfile public-repo/ 2>/dev/null || :
          cp private-repo/README.md public-repo/ 2>/dev/null || :
          cp -r private-repo/docs public-repo/ 2>/dev/null || :
          
          cd public-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add copied files and directories
          git add Dockerfile README.md docs
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync Dockerfile, README, and docs for release ${{ github.ref_name }}"
          git push origin main
          
          # Create the tag on the public repo so the release attaches correctly
          git tag ${{ github.ref_name }} || true
          git push origin ${{ github.ref_name }} || true

      # 6. Create the Release on the PUBLIC Repo using the PAT
      # CHANGE 'deniskipeles/apexkit' to your exact public repository name
      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          files: all-binaries/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false