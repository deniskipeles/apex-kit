name: Build and Publish ApexKit

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always
  OPENSSL_STATIC: 1
  PKG_CONFIG_ALL_STATIC: 1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ubuntu-latest
    # Define these globally at the job level so both "check" and "build" steps inherit them
    env:
      CFLAGS: "-msse4.1 -mssse3 -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CXXFLAGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os_name: Linux
            binary_name: apexkit
            extension: ""
          - target: x86_64-pc-windows-msvc
            os_name: Windows
            binary_name: apexkit
            extension: ".exe"

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Tailwind CSS
        run: |
          mkdir -p static

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ninja-build mingw-w64 nasm perl cmake pkg-config libssl-dev protobuf-compiler
          # Create compiler symlinks required by cc-rs for cross-compiling to MSVC on Linux
          sudo ln -sf /usr/bin/clang /usr/bin/clang-cl
          sudo ln -sf /usr/bin/llvm-ar /usr/bin/llvm-lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Admin UI
        working-directory: admin-ui
        run: |
          npm install
          npm run build

      - name: Move Admin Assets
        run: |
          mkdir -p static/dashboard
          cp -r admin-ui/dist/* static/dashboard/

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-xwin (for Windows MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          cargo install cargo-xwin --locked

      - name: Check and Auto-download SDK
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          # This compiles the dependencies but stops before linking, 
          # forcing cargo-xwin to automatically download and extract the SDK.
          cargo xwin check --target x86_64-pc-windows-msvc --release

      - name: Apply Case-Sensitivity Symlinks
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          # Create the case-correct symlinks in the automatically populated cache
          XWIN_UM_DIR="$HOME/.cache/cargo-xwin/xwin/sdk/lib/um/x86_64"
          ln -sf "$XWIN_UM_DIR/directml.lib" "$XWIN_UM_DIR/DirectML.lib"
          ln -sf "$XWIN_UM_DIR/pathcch.lib" "$XWIN_UM_DIR/PathCch.lib"

      - name: Build (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]; then
            OPENSSL_NO_ASM=1 RUSTFLAGS="-C target-feature=+crt-static -C debuginfo=0 -C link-arg=/DEBUG:NONE" cargo xwin build --target ${{ matrix.target }} --release -p apexkit-cli  --no-default-features
          else
            cargo build --target ${{ matrix.target }} --release -p apexkit-cli
          fi

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Locate built binary (cargo xwin builds directly into standard target directories)
          SRC_BIN="target/${{ matrix.target }}/release/apexkit-cli${{ matrix.extension }}"
          BIN_NAME="apexkit${{ matrix.extension }}"
          
          cp "$SRC_BIN" "$BIN_NAME"

          if [ "${{ matrix.os_name }}" == "Windows" ]; then
            # Windows: Zip compression
            DEST_ARCHIVE="dist/${{ matrix.binary_name }}-${{ matrix.target }}.zip"
            zip "$DEST_ARCHIVE" "$BIN_NAME"
          else
            # Linux: Tar.gz compression
            DEST_ARCHIVE="dist/${{ matrix.binary_name }}-${{ matrix.target }}.tar.gz"
            tar -czvf "$DEST_ARCHIVE" "$BIN_NAME"
          fi

      - name: Upload to Actions
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish_to_public:
    name: Publish to Public Repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the PRIVATE repo to grab Dockerfile and README
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          path: private-repo

      # 2. Checkout the PUBLIC repo to push files
      - name: Checkout Public Repo
        uses: actions/checkout@v4
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public-repo

      # 3. Download binaries from the build job
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      # 4. Generate Checksums
      - name: Generate Checksums
        run: |
          cd all-binaries
          sha256sum * > checksums.txt
          cat checksums.txt

      # 5. Sync Dockerfile, README, docs, hosting and logo to Public Repo
      - name: Update Public Repo Files
        run: |
          # 1. Copy standard files from private to public workspace
          cp private-repo/Dockerfile public-repo/ 2>/dev/null || :
          cp private-repo/README.md public-repo/ 2>/dev/null || :
          cp -r private-repo/docs public-repo/ 2>/dev/null || :
          cp -r private-repo/hosting public-repo/ 2>/dev/null || :
          
          # 2. Copy the logo file
          # Ensure the directory exists in the public repo first
          mkdir -p public-repo/static/images
          cp private-repo/static/images/apexkit-logo.svg public-repo/static/images/
          
          cd public-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 3. Add all files including the new static directory
          git add Dockerfile README.md docs hosting static/images
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync assets and docs for release ${{ github.ref_name }}"
          git push origin main
          
          # Create the tag on the public repo so the release attaches correctly
          git tag ${{ github.ref_name }} || true
          git push origin ${{ github.ref_name }} || true

      # 6. Create the Release on the PUBLIC Repo using the PAT
      - name: Create Release on Public Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: deniskipeles/apexkit
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          files: all-binaries/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false