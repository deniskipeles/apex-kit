[package]
name = "apexkit-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
apexkit-api = { path = "../apexkit-api", default-features = false }
apexkit-core = { path = "../apexkit-core", default-features = false }
tokio = { version = "1.37.0", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1" # <--- ADD THIS LINE
regex = "1.10"      # <--- ADD THIS LINE (used in backup.rs)
chrono = "0.4"      # <--- ADD THIS LINE (used in backup.rs)
uuid = { version = "1.8", features = ["v4"] } # <--- ADD THIS LINE (used in backup.rs)
serde_json = "1.0"  # <--- ADD THIS LINE
rusqlite = "0.39.0" # <--- ADD THIS LINE (used in data.rs)
dotenvy = "0.15"

[features]
default = ["onnx"]
onnx = ["apexkit-api/onnx", "apexkit-core/onnx"]
cuda = ["apexkit-api/cuda", "apexkit-core/cuda"]
metal = ["apexkit-api/metal", "apexkit-core/metal"]