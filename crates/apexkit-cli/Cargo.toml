[package]
name = "apexkit-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
apexkit-api = { path = "../apexkit-api", default-features = false }
apexkit-core = { path = "../apexkit-core", default-features = false }
tokio = { version = "1.37.0", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
regex = "1.10"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
serde_json = "1.0"
rusqlite = "0.39.0"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls-vendored"] }
wasmtime = "24.0.0"
ring = "0.17.14"

[features]
default = ["onnx"]
onnx = ["apexkit-api/onnx", "apexkit-core/onnx"]
cuda = ["apexkit-api/cuda", "apexkit-core/cuda"]
metal = ["apexkit-api/metal", "apexkit-core/metal"]